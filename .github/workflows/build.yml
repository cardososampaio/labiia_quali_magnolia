# Builds and tests labiia_quali on Windows for every push and pull request:
# the interface (types and tests), the Node helper with the lexical engine,
# the Rust core (QDPX, codebooks, lexical results) and the app itself.
# It doesn't produce installers.

name: Build

on:
  push:
    branches: [labiia-quali, labiia-quali-2]
    paths-ignore:
      - 'manual/**'
      - 'manuais/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Helper (Node runtime and lexical engine bundle)
        run: npm run prepare:helper

      - name: Interface and helper typecheck and tests
        run: |
          npm run typecheck
          npx vitest run

      - name: Core tests (QDPX, converters, codebooks, lexical results)
        run: cargo test -p magnolia-core

      - name: Build the app
        run: npx tauri build --no-bundle
