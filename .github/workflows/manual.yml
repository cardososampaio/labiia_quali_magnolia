# Publishes the labiia_quali user manual (plain HTML in manuais/) to GitHub
# Pages at https://cardososampaio.github.io/labiia_quali_magnolia/, so the
# Help tab's Manual button and anyone without the program can read it.
#
# One-time setup: repo Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". After that, every push to labiia-quali that
# touches manuais/ republishes the manual automatically.

name: Deploy manual

on:
  push:
    branches: [labiia-quali]
    paths:
      - 'manuais/**'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manual needs no build; the page template is left out.
      - run: rm -f manuais/_modelo.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: manuais

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
