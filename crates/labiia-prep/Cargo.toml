[package]
name = "labiia-prep"
version = "0.1.0"
edition = "2024"
description = "labiia_quali's corpus preparation for the lexical analyses: plurals, spelling variants, the researcher's equivalences and multiword expressions."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1.26"
